<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran Akun</title>
</head>
<body>
    <!-- Navigasi Halaman -->

        <a href="Index.html">Home</a> | 
        <a href="Blog.html">Blog</a> | 
        <a href="Blog-Detail.html">Detail Blog</a> | 
        <a href="form.html">Form</a> | 
        <a href="cv.html">CV</a>

    <hr>
    
    <form>
        <fieldset>
            <legend>Daftar Akun</legend>
            
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama"><br><br>

            <label>Jenis Kelamin:</label>
            <input type="radio" id="laki" name="jenis_kelamin" value="Laki-Laki">
            <label for="laki">Laki-Laki</label>
            <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
            <label for="perempuan">Perempuan</label><br><br>

            <label for="tempat_lahir">Tempat Lahir:</label>
            <input type="text" id="tempat_lahir" name="tempat_lahir"><br><br>

            <label for="tanggal_lahir">Tanggal Lahir:</label>
            <input type="date" id="tanggal_lahir" name="tanggal_lahir"><br><br>

            <label for="agama">Agama:</label>
            <select id="agama" name="agama">
                <option value="">--- Pilih Agama ---</option>
                <option value="Islam">Islam</option>
                <option value="Katolik">Katolik</option>
                <option value="Protestan">Protestan</option>
                <option value="Hindu">Hindu</option>
                <option value="Buddha">Buddha</option>
                <option value="Konghucu">Konghucu</option>
            </select><br><br>

            <label>Hobi:</label>
            <input type="checkbox" id="hobi1" name="hobi" value="Olahraga">
            <label for="hobi1">Olahraga</label>
            <input type="checkbox" id="hobi2" name="hobi" value="Membaca">
            <label for="hobi2">Membaca</label>
            <input type="checkbox" id="hobi3" name="hobi" value="Ngoding">
            <label for="hobi3">Ngoding</label><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>

            <input type="checkbox" id="persetujuan" name="persetujuan">
            <label for="persetujuan">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label><br><br>

            <input type="reset" value="Reset">
            <input type="submit" value="Submit">
        </fieldset>
    </form>
</body>
</html>
